[project]
name = "fsi-credit-assistant"
version = "0.1.0"
description = "Credit-origination copilot demo — MongoDB Atlas as the single data plane"
requires-python = ">=3.12"
dependencies = [
    # Pinned per docs/specs/13-verified-api-contract.md §1 — do not bump this week.
    "langgraph==1.2.10",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-mongodb==0.4.0",
    "langgraph-store-mongodb==0.3.0",
    "langchain-mongodb==0.11.0",
    "langchain-voyageai==0.4.0",
    "langchain-openai==1.4.3",
    "langchain-core==1.5.3",
    "deepagents==0.7.5",
    "langchain==1.3.14",
    "pymongo==4.16.0",
    # Not version-pinned by §1 — infra glue.
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false
